<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BRF Night Ops KPI</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E7285">
<!-- iOS has no manifest support worth relying on; these do the same job -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Night Ops KPI">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#0D1B24; --card:#101A21; --line:#1D2C36; --track:#16242C;
    --ink:#E8F1F5; --muted:#7B94A1; --accent:#68D8E8; --accent-dim:#0E7285;
    --green:#4BD48E; --amber:#F2B33D; --red:#F1595E;
    --display:"Segoe UI",system-ui,-apple-system,sans-serif;
    --mono:"SF Mono",Consolas,ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);
       display:flex;align-items:center;justify-content:center;
       padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
        padding:30px 26px;width:440px;max-width:100%;text-align:center}
  h1{font-size:17px;letter-spacing:.18em;text-transform:uppercase;margin:0 0 3px;font-weight:600}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:12.5px;margin-bottom:24px}
  .state{display:flex;align-items:center;justify-content:center;gap:9px;
         color:var(--muted);font-size:13px;margin-bottom:14px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
  .dot.on{background:var(--green)} .dot.off{background:var(--red)}
  .dot.busy{background:var(--amber);animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .url{background:var(--track);border:1px solid var(--line);border-radius:9px;
       padding:11px 13px;font-family:var(--mono);font-size:12px;color:var(--accent);
       word-break:break-all;margin-bottom:18px;min-height:42px}
  button{width:100%;padding:15px;border:0;border-radius:10px;font-size:15px;font-weight:600;
         font-family:var(--display);margin-bottom:9px;-webkit-tap-highlight-color:transparent}
  .go{background:var(--accent-dim);color:#fff}
  .go:active{background:var(--accent);color:var(--bg)}
  .go[disabled]{opacity:.45}
  .ghost{background:none;color:var(--muted);border:1px solid var(--line)}
  .note{color:var(--muted);font-size:11.5px;line-height:1.65;margin-top:16px}
  .note b{color:var(--ink);font-weight:600}
  .stamp{color:var(--muted);font-size:11px;margin-top:12px;font-family:var(--mono)}
  .install{display:none;margin-top:14px;padding:12px;border:1px dashed var(--line);
           border-radius:10px;font-size:12px;color:var(--muted);line-height:1.6}
  .install.show{display:block}
</style>
</head>
<body>
<div class="card">
  <h1>Night Ops <span>KPI</span></h1>
  <div class="sub">AL Madina Logistics &middot; DC BRF OPS</div>

  <div class="state"><span class="dot busy" id="dot"></span><span id="state">finding the tracker…</span></div>
  <div class="url" id="url">&mdash;</div>

  <button class="go" id="open" disabled>Open the tracker</button>
  <button class="ghost" id="again">Look again</button>

  <div class="install" id="install"></div>

  <div class="note">
    On the DC network the tracker opens without a sign-in. From outside it asks
    who you are — <b>sign up once</b>, then it remembers you.
  </div>
  <div class="stamp" id="stamp"></div>
</div>

<script>
/* Where the tracker is tonight.
   A quick Cloudflare tunnel gets a new address every time it starts, so the
   address is never built into this app. The tracker publishes it to a small
   file on GitHub and this page reads that file. Nothing to rebuild, nothing
   to send round — the app just asks where to go. */
const LOOKUP = [
  "https://raw.githubusercontent.com/sudhanraj25/tunnel-config/main/kpi.json",
  // jsDelivr serves the same file and is reachable where raw.githubusercontent
  // is blocked; it lags a few minutes, so it is only the fallback.
  "https://cdn.jsdelivr.net/gh/sudhanraj25/tunnel-config@main/kpi.json",
];
const LAN_FALLBACK = "http://192.168.20.95:5005";
const $ = id => document.getElementById(id);
let target = "";

function show(kind, message){
  $("dot").className = "dot " + kind;
  $("state").textContent = message;
}

async function findTracker(){
  show("busy", "finding the tracker…");
  $("open").disabled = true;
  for (const source of LOOKUP){
    try{
      // cache-bust: a stale answer sends the night team to a dead tunnel
      const r = await fetch(source + "?t=" + Date.now(), {cache: "no-store"});
      if (!r.ok) continue;
      const d = await r.json();
      const url = d.url || d.tunnel_url;
      if (!url) continue;
      target = url;
      $("url").textContent = url;
      $("open").disabled = false;
      show("on", "tracker found");
      $("stamp").textContent = d.updated ? "address published " + d.updated.replace("T", " ") : "";
      localStorage.setItem("kpiUrl", url);
      return;
    }catch(e){ /* try the next source */ }
  }
  // Nothing answered — offer whatever worked last, then the LAN address.
  const remembered = localStorage.getItem("kpiUrl");
  target = remembered || LAN_FALLBACK;
  $("url").textContent = target;
  $("open").disabled = false;
  show("off", remembered ? "could not reach GitHub — using the last address"
                         : "could not reach GitHub — trying the DC network");
  $("stamp").textContent = "";
}

$("open").addEventListener("click", () => { if (target) location.href = target; });
$("again").addEventListener("click", findTracker);

/* Installing. Android fires beforeinstallprompt; iOS never has, so it gets
   told how to do it by hand. */
let prompter = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  prompter = e;
  const box = $("install");
  box.className = "install show";
  box.innerHTML = '<button class="ghost" id="doInstall" style="margin:0">Add to home screen</button>';
  $("doInstall").addEventListener("click", async () => {
    prompter.prompt();
    await prompter.userChoice;
    prompter = null;
    box.className = "install";
  });
});

const standalone = window.matchMedia("(display-mode: standalone)").matches ||
                   window.navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
if (isIOS && !standalone){
  const box = $("install");
  box.className = "install show";
  box.innerHTML = "To keep this on the home screen: tap <b>Share</b>, then " +
                  "<b>Add to Home Screen</b>.";
}

if ("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

findTracker();
</script>
</body>
</html>
